name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv run --locked ruff check
      - run: uv run --locked ruff format --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv build
      # Dev dependencies only, then the wheel just built: tests import the installed package,
      # not the source tree (src/ is not on the path; pytest's pythonpath is train/ and bench/).
      - run: uv sync --locked --no-install-project
      - run: uv pip install dist/*.whl
      - name: Show which colonycount is imported
        run: uv run --no-sync python -c "import colonycount; print(colonycount.__version__, colonycount.__file__)"
      - run: uv run --no-sync pytest
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
