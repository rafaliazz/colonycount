name: Release

# Pushing a tag vX.Y.Z builds the package, tests the wheel, and publishes it to PyPI through
# trusted publishing (OIDC): no API token is stored anywhere. The tag must match the version in
# pyproject.toml. PyPI's publisher for this repo is set to workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME}" = "v$v" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - run: uv build
      # Same check as CI: tests import the wheel just built, not the source tree.
      - run: uv sync --locked --no-install-project
      - run: uv pip install dist/*.whl
      - run: uv run --no-sync pytest
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
