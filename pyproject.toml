[project]
name = "colonycount"
version = "0.1.0"
description = "Offline bacterial colony counter for agar plate photos"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "rafaliazz", email = "rafali.azzam2245@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy",
    "onnxruntime",
    "opencv-python-headless",
    "platformdirs",
    "python-dotenv>=1.2.4",
]

[project.scripts]
colonycount = "colonycount.cli:main"

[project.optional-dependencies]
napari = ["napari", "magicgui"]
demo = ["gradio"]
train = ["rfdetr[train]==1.12.1", "torch", "torchvision"]

[dependency-groups]
dev = ["onnx", "pre-commit", "pytest", "ruff"]
prepare = ["openpyxl", "pyarrow"]
# Benchmark-only YOLOv8 baseline (task 2.2). Ultralytics is AGPL-3.0: never a package dependency,
# never imported from src/colonycount. Install: uv sync --extra train --group baseline
baseline = ["ultralytics==8.4.211"]
# YOLOX-Tiny/M baselines (task 2.3), Apache-2.0. The model code is vendored in
# train/third_party/yolox (pinned commit, see its NOTICE); the PyPI/git package does not install on
# 3.14. Torch comes from the train extra. Install: uv sync --extra train --group dev --group yolox
yolox = ["pycocotools==2.0.11"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["train", "bench"]

[tool.ruff]
line-length = 100
extend-exclude = ["train/third_party"]  # vendored as-is

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
