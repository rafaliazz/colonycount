[project]
name = "colonycount"
version = "0.1.0"
description = "Offline bacterial colony counter for agar plate photos"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "rafaliazz", email = "rafali.azzam2245@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime",
    "opencv-python-headless",
    "platformdirs",
]

[project.optional-dependencies]
napari = ["napari", "magicgui"]
demo = ["gradio"]
train = ["torch", "torchvision"]

[dependency-groups]
dev = ["pre-commit", "pytest", "ruff"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
